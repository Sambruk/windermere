# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
        include:
        - os: ubuntu-latest
          binaryname: windermere
        - os: windows-2022
          binaryname: windermere.exe
    name: Build Windermere server binary 
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build Windermere
      working-directory: ./cmd/windermere
      run: go build -v

    # DB images are Linux-only, so the Windows runner falls back to the default SQLite testing
    - name: Start test databases
      if: runner.os == 'Linux'
      working-directory: ./testdbs
      run: docker compose up -d --wait

    - name: Test
      run: go test -v ./...
      env:
        WINDERMERE_TEST_DB_DRIVERS: ${{ runner.os == 'Linux' && 'sqlite://:memory:;mysql://root:windermere@tcp(127.0.0.1:3306)/windermere?multiStatements=true;sqlserver://sa:Windermere1!@127.0.0.1:1433?database=windermere;postgres://windermere:windermere@127.0.0.1:5432/windermere?sslmode=disable' || '' }}

    - name: Stop test databases
      if: always() && runner.os == 'Linux'
      working-directory: ./testdbs
      run: docker compose down -v

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: windermere-${{ matrix.os }}
        path: cmd/windermere/${{ matrix.binaryname }}
