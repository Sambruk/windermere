# Brings up test databases for the SQL backends, to be used by the Windermere unit tests
# or for manual testing.
#
# Usage:
#   docker compose up -d
#
# Then point the tests at them, e.g. (PowerShell):
#   $env:WINDERMERE_TEST_DB_DRIVERS = "mysql://root:windermere@tcp(127.0.0.1:3306)/windermere?multiStatements=true;sqlserver://sa:Windermere1!@127.0.0.1:1433?database=windermere;postgres://windermere:windermere@127.0.0.1:5432/windermere?sslmode=disable"
#   go test ./windermere/...
#
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: windermere
      MYSQL_DATABASE: windermere
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pwindermere"]
      interval: 5s
      timeout: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Windermere1!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # mssql (unlike the mysql/postgres images) has no env var to auto-create a database, so do it here.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "mssql", "-U", "sa", "-P", "Windermere1!", "-Q", "IF DB_ID('windermere') IS NULL CREATE DATABASE windermere"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: windermere
      POSTGRES_PASSWORD: windermere
      POSTGRES_DB: windermere
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windermere -d windermere"]
      interval: 5s
      timeout: 5s
      retries: 10
